name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Torch and Transformers are not needed for the data pipeline, the
      # baselines or the tests, and installing them would dominate CI time.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pyyaml tqdm typer rich pillow
          pip install pytest ruff black
          pip install -e . --no-deps

      - name: Lint
        run: |
          ruff check src tests
          black --check src tests

      - name: Test
        run: pytest -q

      # The tests run on synthetic frames, so CI proves the pipeline's logic
      # without needing the Drive dataset.
      - name: Import check
        run: python -c "import bmpb, bmpb.cli, bmpb.train, bmpb.evaluate, bmpb.audit"
