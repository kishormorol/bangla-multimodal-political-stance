[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmpb"
version = "0.1.0"
description = "Bangla multimodal political stance detection: dataset, text and vision-language baselines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Morol", email = "kishormorol.working@gmail.com" }]
keywords = ["bangla", "bengali", "political-stance", "media-framing", "multimodal", "nlp", "vision-language"]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "typer>=0.12",
  "rich>=13.7",
  "pillow>=10.0",
  "torch>=2.2",
  "transformers>=4.40",
  "datasets>=2.18",
  "sentencepiece>=0.2",
  "accelerate>=0.29",
  "normalizer @ git+https://github.com/csebuetnlp/normalizer",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "black>=24.0", "pre-commit>=3.7"]
viz = ["matplotlib>=3.8", "seaborn>=0.13"]
fetch = ["gdown>=5.1"]

[project.scripts]
bmpb = "bmpb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's whole API is `typer.Option(...)` as a default argument.
"src/bmpb/cli.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
