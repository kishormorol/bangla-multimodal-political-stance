# Image ablation of vilt.yaml: identical except image_ablation: shuffled.
# Added after the matched results were seen, by the author's decision
# (HANDOFF.md, 2026-11-18). Compare against the real-image run on the same folds.
# ViLT truncates text at 40 tokens, so it sees roughly a headline's worth of a
# news article. Worth keeping in the table for exactly that reason.
name: vilt_shuffled
modality: multimodal
family: fusion_encoder
pretrained: dandelin/vilt-b32-mlm
num_labels: 3
epochs: 10
batch_size: 8
learning_rate: 5.0e-5
max_length: 40
image_size: 384
freeze_encoder: true
class_weights: true
early_stopping_patience: 3
seed: 42
image_ablation: shuffled
