# CLIP was not pretrained on Bangla; its tokenizer shreds Bangla script into
# byte fragments. Expect a weak text stream — that is the measurement, not a bug.
name: clip
modality: multimodal
family: clip_like
pretrained: openai/clip-vit-base-patch32
num_labels: 3
epochs: 10
batch_size: 16
learning_rate: 1.0e-4   # head-only LR; the backbone is frozen
max_length: 77          # CLIP's hard context limit
image_size: 224
freeze_encoder: true
class_weights: true
early_stopping_patience: 3
seed: 42
params:
  fusion: gated
