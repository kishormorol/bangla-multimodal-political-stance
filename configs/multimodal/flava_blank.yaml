# Image ablation of flava.yaml: identical except image_ablation: blank.
# Added after the matched results were seen, by the author's decision
# (HANDOFF.md, 2026-11-18). Compare against the real-image run on the same folds.
name: flava_blank
modality: multimodal
family: fusion_encoder
pretrained: facebook/flava-full
num_labels: 3
epochs: 10
batch_size: 8
learning_rate: 5.0e-5
max_length: 128
image_size: 224
freeze_encoder: true
class_weights: true
early_stopping_patience: 3
seed: 42
image_ablation: blank
