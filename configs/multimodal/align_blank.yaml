# Image ablation of align.yaml: identical except image_ablation: blank.
# Added after the matched results were seen, by the author's decision
# (HANDOFF.md, 2026-11-18). Compare against the real-image run on the same folds.
name: align_blank
modality: multimodal
family: clip_like
pretrained: kakaobrain/align-base
num_labels: 3
epochs: 10
batch_size: 16
learning_rate: 1.0e-4
max_length: 64
image_size: 289
freeze_encoder: true
class_weights: true
early_stopping_patience: 3
seed: 42
params:
  fusion: gated
image_ablation: blank
