# Ablation: TF-IDF + logistic regression without training-fold augmentation.
# Compare with configs/text/tfidf_logreg.yaml to measure the augmentation effect.
name: tfidf_logreg_no_aug
modality: text
family: sklearn_text
num_labels: 3
class_weights: true
augment: false
seed: 42
params:
  vectorizer: tfidf
  analyzer: char_wb
  ngram_range: [2, 5]
  min_df: 2
  max_features: 50000
  classifier: logreg
  C: 1.0
