# Ablation: CLIP with unfrozen encoder (full fine-tuning).
# Compare with configs/multimodal/clip.yaml (freeze_encoder: true) to measure
# the effect of fine-tuning the backbone on this small corpus.
name: clip_unfrozen
modality: multimodal
family: clip_like
pretrained: openai/clip-vit-base-patch32
num_labels: 3
epochs: 10
batch_size: 16
learning_rate: 1.0e-5   # lower LR for full fine-tuning to avoid catastrophic forgetting
max_length: 77
image_size: 224
freeze_encoder: false
class_weights: true
early_stopping_patience: 3
seed: 42
params:
  fusion: gated
